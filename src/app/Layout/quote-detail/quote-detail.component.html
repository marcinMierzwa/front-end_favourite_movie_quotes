<app-page-wrapper>
  
  @if (isLoading()) {
  <div class="h-100 d-flex justify-content-center align-items-center">
    <mat-spinner [strokeWidth]="5"></mat-spinner>
  </div>
  } @else if (!quote()) {
  <h5 class="text-light text-center">Sorry! No quotes found.</h5>
  } @else {

  <app-card
    class="card-detail-dimensions d-flex flex-column"
    [backgroundUrl]="quote()?.backgroundUrl"
    [dialog]="quote()?.dialog"
  >
    <app-card-icons-bar icon-bar-detail>
      <app-share share [isLoggedIn]="isLoggedIn()" />
      <app-favourites
        favourites
        [favouritesIds]="favouriteIds()"
        [quoteId]="quote()?._id"
        [isLoggedIn]="isLoggedIn()"
        (click)="toggleFavourite(quote()!._id)"
      />
      <app-likes
        likes
        [isLiked]="quote()!.isLikedByUser"
        [counter]="quote()!.likeCount"
        [quoteId]="quote()!._id"
        [isLoggedIn]="isLoggedIn()"
        (onToggleLike)="toggleLike($event)"
      />
    </app-card-icons-bar>
  </app-card>

  <div class="d-flex flex-column gap-2 card-detail-dimensions rounded mt-2 m-0">
    <div
      class="container-fluid d-flex align-items-center gap-1 gap-sm-3 bg-dark p-2 ps-3 rounded"
    >
      <p class="m-0 card-text-link">Which Character Said?</p>
      <a
        class="card-text-link"
        style="font-style: italic; text-decoration: underline"
        routerLink="character"
      >
        {{ quote()?.character }}
      </a>
    </div>

    <div
      class="container-fluid d-flex flex-wrap align-items-center gap-1 gap-sm-3 bg-dark p-2 ps-3 rounded"
    >
      <p class="m-0 card-text-link">Which Movie?</p>
      <a
        class="card-text-link"
        style="font-style: italic; text-decoration: underline"
        routerLink="character"
      >
        {{ quote()?.movie }}
      </a>
    </div>
  </div>

  }
</app-page-wrapper>
